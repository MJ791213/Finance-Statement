<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Privacy: scripts, styles and fonts may only come from this site's own
     files. The only network destination allowed is your Supabase project
     (accounts + the encrypted workspace). Statement data is encrypted in this
     tab before it is uploaded. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file:; connect-src https://*.supabase.co; worker-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statement Categorizer</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>Statement Categorizer</h1>
    <span class="privacy" title="Statements are read in this browser tab. Your workspace is encrypted with your password before it is saved online, and only your account can load it.">🔒 Encrypted before upload · only you can see your data</span>
  </div>
  <div class="actions" id="app-actions" hidden>
    <span id="save-status" class="save-status" title=""></span>
    <button id="btn-export" class="primary">⬇ Export Excel</button>
    <button id="btn-backup">Backup</button>
    <label class="button">Restore<input type="file" id="restore-file" accept=".json,application/json" hidden></label>
    <button id="btn-clear" class="danger">Clear all data</button>
    <span class="user-chip" id="user-chip"><span id="user-name"></span><button id="btn-logout" class="mini">Log out</button></span>
  </div>
</header>

<section id="auth" class="auth"></section>

<div id="app" hidden>

<section class="filters">
  <label>Account <select id="f-account"></select></label>
  <label>Month <select id="f-month"></select></label>
  <span id="f-info" class="muted"></span>
</section>

<nav class="tabs" id="tabs">
  <button data-tab="import" class="active">Import</button>
  <button data-tab="accounts">Accounts</button>
  <button data-tab="summary">Summary</button>
  <button data-tab="categories">Categories</button>
  <button data-tab="transactions">Transactions</button>
  <button data-tab="trips">Trips</button>
  <button data-tab="receipts">Receipts</button>
  <button data-tab="settings">Rules &amp; Settings</button>
</nav>

<main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/pdf.min.js"></script>
<!-- Loading the worker as a plain script makes pdf.js run in this page instead
     of a separate worker, which is what lets it work from file:// -->
<script src="vendor/pdf.worker.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/categories.js"></script>
<script src="js/statement.js"></script>
<script src="js/pdftext.js"></script>
<script src="js/receipts.js"></script>
<script src="js/trips.js"></script>
<script src="js/engine.js"></script>
<script src="js/crypto.js"></script>
<script src="js/backend.js"></script>
<script src="js/store.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
